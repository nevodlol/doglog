services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - doglog_network

  backend:
    build: ./backend
    container_name: fastapi_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - doglog_network

  frontend:
    build: ./frontend
    container_name: react_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - doglog_network
    volumes:
      - /var/ww/doglog/nginx/certbot/conf:/etc/letsencrypt
      - /var/ww/doglog/nginx/certbot/www:/var/www/certbot

  certbot:
    image: certbot/certbot
    container_name: certbot_client
    volumes:
      - /var/ww/doglog/nginx/certbot/conf:/etc/letsencrypt
      - /var/ww/doglog/nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d; done'"
    networks:
      - doglog_network

volumes:
  postgres_data:
  backend_uploads:

networks:
  doglog_network:
    driver: bridge
