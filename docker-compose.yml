services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doglog}
      POSTGRES_USER: ${POSTGRES_USER:-doglogger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doggywtf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://doglogger:doggywtf@db:5432/doglog}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://демо.доглог.рф}
    volumes:
      - backend_uploads:/app/uploads
      - ./акт взвешивания.docx:/app/акт взвешивания.docx:ro
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  backend_uploads:

